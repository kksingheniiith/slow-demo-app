<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slow Demo App - Performance Optimized</title>
  
  <!-- FIX: Added favicon to eliminate 404 errors -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      background: #f4f6f8;
      color: #222;
    }
    h1 { 
      margin-top: 0;
      color: #2c5aa0;
    }
    #status {
      padding: 12px 16px;
      background: #d4edda;
      border: 1px solid #c3e6cb;
      border-radius: 6px;
      margin-bottom: 16px;
      color: #155724;
    }
    #app { display: none; }
    .controls { 
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button {
      padding: 10px 16px;
      border: 1px solid #4a90e2;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    button:hover { 
      background: #4a90e2;
      color: white;
    }
    button:active {
      transform: scale(0.98);
    }
    #list {
      max-height: 400px;
      overflow: auto;
      background: #fff;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-top: 12px;
    }
    .row {
      padding: 6px 8px;
      border-bottom: 1px solid #eee;
      font-family: 'Courier New', monospace;
      font-size: 13px;
    }
    .row:last-child {
      border-bottom: none;
    }
    #box {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin-top: 12px;
      border-radius: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .badge {
      display: inline-block;
      background: #28a745;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-left: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>Slow Demo App <span class="badge">OPTIMIZED</span></h1>
  <div id="status">Initializing...</div>

  <div id="app">
    <div class="controls">
      <button id="btn-long-task">Run Long Task (non-blocking)</button>
      <button id="btn-leak">Start Memory Leak</button>
      <button id="btn-thrash">Layout Optimize</button>
      <button id="btn-render-big">Render 50k Rows (fast)</button>
    </div>
    <div id="box"></div>
    <div id="list"></div>
  </div>

  <!-- FIX: Added defer attribute to prevent parser blocking -->
  <script src="app.js" defer></script>
</body>
</html>
