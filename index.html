<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slow Demo App</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      background: #f4f6f8;
      color: #222;
    }
    h1 { margin-top: 0; }
    #status {
      padding: 12px 16px;
      background: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    #app { display: none; }
    .controls { margin-bottom: 16px; }
    button {
      padding: 8px 14px;
      margin-right: 8px;
      border: 1px solid #888;
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #eee; }
    #list {
      max-height: 320px;
      overflow: auto;
      background: #fff;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
    .row {
      padding: 6px 8px;
      border-bottom: 1px solid #eee;
      font-family: monospace;
      font-size: 13px;
    }
    #box {
      width: 60px;
      height: 60px;
      background: #4a90e2;
      margin-top: 12px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>Slow Demo App</h1>
  <div id="status">Loading… please wait ~10 seconds.</div>

  <div id="app">
    <div class="controls">
      <button id="btn-long-task">Run Long Task (blocks UI)</button>
      <button id="btn-leak">Start Memory Leak</button>
      <button id="btn-thrash">Layout Thrash</button>
      <button id="btn-render-big">Render 50k Rows</button>
    </div>
    <div id="box"></div>
    <div id="list"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
